{% extends "base.html" %}
{% block page_title %} Configurações {% endblock %}

{% block content %}
<fieldset>
<h1 class="page-title">👤 Perfil</h1>
<div class="card">
  <div class="row">
    <div class="field">
      <label>Nome exibido</label>
      <input type="text" id="nome" placeholder="Seu nome: ">
    </div>

    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Sua senha: ">
    </div>

    <div class="field">
      <label>Permissão</label>
      <input type="text" id="role" placeholder="Seu nível de permissão: ">
    </div>

    <div class="field">
      <label>Casa do usuário</label>
      <select id="userHouseSelect"></select>
    </div>
  </div>

  <div class="actions">
    <button class="btn-secondary">Cancelar</button>
    <button class="btn-primary" onclick="criarUsuario()">Salvar Configurações</button>
  </div>
</div>
</fieldset>

<fieldset>
<h1 class="page-title">🏠 Casas</h1>
<div class="card">
  <div class="row">
    <div class="field">
      <label>Casa ativa</label>
      <select id="houseSelect"></select>
    </div>
    <div class="field" style="align-self:flex-end;">
      <button class="botoes-config" onclick="selecionarCasa()">Selecionar</button>
    </div>
  </div>

  <hr>

  <div class="row">
    <div class="field">
      <label>Nova casa</label>
      <input type="text" id="newHouseName" placeholder="Ex: Casa da Praia">
    </div>
    <div class="field" style="align-self:flex-end;">
      <button class="botoes-config" onclick="criarCasa()">Adicionar Casa</button>
    </div>
  </div>
</div>
</fieldset>

<fieldset>
<h1 class="page-title">👥 Usuários</h1>
<div class="card">
  <table id="usersTable">
    <thead>
      <tr>
        <th>Usuário</th>
        <th>Perfil</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
</fieldset>

<fieldset>
<button class="botoes-config" onclick="console.log('click'); enableNotifications()">Ativar Notificações</button>
</fieldset>


<script>
window.enableNotifications = async function () {
    try {
        const permission = await Notification.requestPermission();

        if (permission !== "granted") {
            console.log("Permissão negada");
            return;
        }

        const registration = await navigator.serviceWorker.ready;

        if (!registration) {
            console.log("Service Worker não pronto");
            return;
        }

        await subscribeUser(registration);
        console.log("Inscrição concluída");

    } catch (err) {
        console.error("Erro notifications:", err);
    }
};
/* ==========================
   CASAS
========================== */
async function carregarCasas() {
  const res = await fetch("/api/houses");
  const houses = await res.json();

  // Select da casa ativa
  const select = document.getElementById("houseSelect");
  select.innerHTML = "";
  houses.forEach(h => {
    const opt = document.createElement("option");
    opt.value = h.id;
    opt.textContent = h.name;
    select.appendChild(opt);
  });

  // Select da casa padrão do usuário
  const userHouseSelect = document.getElementById("userHouseSelect");
  if (userHouseSelect) {
    userHouseSelect.innerHTML = "";
    houses.forEach(h => {
      const opt = document.createElement("option");
      opt.value = h.id;
      opt.textContent = h.name;
      userHouseSelect.appendChild(opt);
    });
  }
}

async function selecionarCasa() {
  const house_id = document.getElementById("houseSelect").value;

  const res = await fetch("/api/houses/select", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ house_id })
  });

  if (res.ok) {
    alert("Casa selecionada!");
  } else {
    const data = await res.json();
    alert("Erro ao selecionar casa: " + (data.error || "Erro desconhecido"));
  }
}

async function criarCasa() {
  const name = document.getElementById("newHouseName").value;

  if (!name) {
    alert("Digite o nome da nova casa");
    return;
  }

  const res = await fetch("/api/houses", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ name })
  });

  if (res.ok) {
    document.getElementById("newHouseName").value = "";
    await carregarCasas();
    alert("Casa criada com sucesso!");
  } else {
    const data = await res.json();
    alert("Erro ao criar casa: " + (data.error || "Erro desconhecido"));
  }
}

/* ==========================
   USUÁRIOS
========================== */
async function carregarUsuarios() {
  const res = await fetch("/api/users");
  const data = await res.json();

  if (!res.ok) {
    alert("Não foi possível carregar usuários: " + (data.error || "Erro desconhecido"));
    return;
  }

  const tbody = document.querySelector("#usersTable tbody");
  tbody.innerHTML = "";

  data.forEach(u => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${u.username}</td>
      <td>${u.role}</td>
      <td>
        <button class="botoes-config" onclick="apagarUsuario(${u.id})">🗑 Apagar</button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

async function apagarUsuario(id) {
  if (!confirm("Tem certeza que deseja apagar este usuário?")) return;

  const res = await fetch(`/api/users/${id}`, {
    method: "DELETE"
  });

  if (res.ok) {
    carregarUsuarios();
  } else {
    const data = await res.json();
    alert("Erro ao apagar usuário: " + (data.error || "Erro desconhecido"));
  }
}

async function criarUsuario() {
  const username = document.getElementById("nome").value;
  const password = document.getElementById("senha").value;
  const role = document.getElementById("role").value;
  const house_id = document.getElementById("userHouseSelect").value; // nova linha

  if (!username || !password) {
    alert("Preencha usuário e senha!");
    return;
  }

  const res = await fetch("/api/users", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username, password, role, house_id}) // house_id incluído
  });

  const data = await res.json();

  if (res.ok) {
    alert("Usuário criado com sucesso!");
    document.getElementById("nome").value = "";
    document.getElementById("senha").value = "";
    document.getElementById("role").value = "";
    carregarUsuarios();
  } else {
    alert("Erro ao criar usuário: " + (data.error || "Erro desconhecido"));
  }
}

/* ==========================
   INIT
========================== */
document.addEventListener("DOMContentLoaded", () => {
  carregarCasas();
  carregarUsuarios();
});
</script>
{% endblock %}
