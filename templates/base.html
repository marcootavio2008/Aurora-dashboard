<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aurora{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='android-chrome-512x512.png') }}">
</head>
<body>

    <header class="main-header">
        <button class="menu-toggle" aria-label="Abrir menu lateral">☰</button>
        <h1>{% block page_title %}Aurora{% endblock %}</h1>
    </header>

    <div class="sidebar-menu">
        <button class="close-btn" aria-label="Fechar menu lateral">×</button>
        <ul>
            <li><a href="{{ url_for('home') }}">Início</a></li>
            <li><a href="{{ url_for('casa') }}">Monitoramento</a></li>
            <li><a href="{{ url_for('dash_residencial') }}">Dash Residencial</a></li>
            <li><a href="{{ url_for('configs') }}">Configurações</a></li>
        </ul>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        <script>
function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');

    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function subscribeUser() {
    const registration = await navigator.serviceWorker.ready;

    const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(
            "BFmyZPH_eZg-3Uj3VvmXEJXO5IFKQRadp5pWKs1Rx5jE0QPO0FjodSgBwj6L_B0NraDhu8jykMJ6F8V7LONPe4o"
        )
    });

    await fetch("/save-subscription", {
        method: "POST",
        body: JSON.stringify(subscription),
        headers: { "Content-Type": "application/json" }
    });

    console.log("✅ Inscrito para push");
}

window.addEventListener("load", async () => {
    if ("serviceWorker" in navigator) {
        await navigator.serviceWorker.register("/service-worker.js");
        console.log("SW registrado");

        await subscribeUser(); // 🔥 ESSA LINHA FALTAVA
    }
});
</script>
    </script>

</body>
</html>
